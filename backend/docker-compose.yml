services:
  postgres:
    image: postgres:15-alpine
    container_name: hospitalcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospitalcare
      POSTGRES_PASSWORD: hospitalcare
      POSTGRES_DB: hospitalcare
    ports:
      - "5432:5432"
    volumes:
      - hospitalcare_pgdata:/var/lib/postgresql/data

volumes:
  hospitalcare_pgdata:
